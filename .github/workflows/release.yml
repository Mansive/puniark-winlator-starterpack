name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional release version (must start with v, for example v0.1.0).
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.14.3"
      MESON_VERSION: "1.10.1"
    permissions:
      contents: write
    concurrency:
      group: release-publish
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --force --tags

      - name: Resolve release version
        id: resolve_version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: bash .ci/release-resolve-version.sh

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 file zip

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install "${PYTHON_VERSION}"

      - name: Configure
        run: >-
          uv tool run --python "${PYTHON_VERSION}" --from "meson==${MESON_VERSION}" --with ninja
          meson setup --cross-file meson/cross/mingw32.ini --buildtype release
          .meson/build/mingw-win32-linux

      - name: Build
        run: >-
          uv tool run --python "${PYTHON_VERSION}" --from "meson==${MESON_VERSION}" --with ninja
          meson compile -C .meson/build/mingw-win32-linux

      - name: Package build output
        id: package
        env:
          VERSION: ${{ steps.resolve_version.outputs.version }}
        run: bash .ci/release-package.sh

      - name: Ensure release tag exists for this commit
        env:
          VERSION: ${{ steps.resolve_version.outputs.version }}
        run: bash .ci/release-ensure-tag.sh

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.resolve_version.outputs.version }}
          ASSET_PATH: ${{ steps.package.outputs.asset_path }}
        run: bash .ci/release-publish.sh
