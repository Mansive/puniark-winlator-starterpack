name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  linux-cross-win32:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 file

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Build
        run: make CROSS=1

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        if: ${{ env.ACT != 'true' }}
        with:
          name: bitnessscan-win32
          path: build/
