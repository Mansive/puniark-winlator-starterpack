name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  linux-cross-win32:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build mingw-w64 file python3

      - name: Configure
        run: cmake --preset mingw-win32-linux

      - name: Build
        run: cmake --build --preset mingw-win32-linux

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        if: ${{ env.ACT != 'true' }}
        with:
          name: bitnessscan-win32
          path: build/
